manifest_version: "1.0"
skill_type: interactive_web_skill
name: ai-risk-viz
display_name: AI 供应链漏洞库检索
version: "1.0.0"
description: >
  Open an interactive HTML knowledge page for AI supply-chain risk and vulnerability lookup.
  The enterprise chat can launch it directly in a new browser tab without starting an assessment.
category: ai_supply_chain_risk_lookup
capability_profile: interactive_risk_vulnerability_lookup
input_source_mode: embedded_dataset_only
assessment_types: []
permissions:
  direct_target_access: false
  target_access_purpose: none
  direct_mcp_access: false
  platform_tool_access: false
  network_access: true
  code_execution: false
  file_read_access: false
  file_write_access: false
  returns_sensitive_payload_inline: false
  can_generate_final_report: false
metadata:
  capability_profile: interactive_risk_vulnerability_lookup
planner:
  summary: 打开 AI 供应链漏洞库检索页面，供企业用户在新标签页中交互查询模型风险与漏洞关系。
  intent_examples:
    - 打开 AI 供应链漏洞库
    - 查看 AI 风险漏洞检索页面
    - 我想检索某个模型的安全风险
    - 打开 AI risk visualization
  delivery_mode: open_url
  enterprise_visible: true
web:
  entrypoint: templates/visualization_template.html
embedded_resources:
  embedded_dataset_id: ai-risk-viz-static-html
  summary:
    mode: embedded_static_html
    supports_platform_samples: false
    supports_embedded_dataset: true
    notes:
      - This interactive skill launches a static HTML page in a new browser tab.
      - The current v1 package must keep web assets self-contained or use absolute http(s) asset URLs.
