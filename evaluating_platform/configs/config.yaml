server:
  port: 8080
  mode: debug

llm:
  provider: openai
  base_url: "https://api.deepseek.com/v1"
  api_key: "${LLM_API_KEY}"
  model: "deepseek-chat"
  max_tokens: 4096
  temperature: 0.7

database:
  dsn: "host=postgres user=postgres password=postgres dbname=evaluating_platform port=5432 sslmode=disable client_encoding=UTF8"
  max_conns: 20
  min_conns: 2
  migrate_on_start: true

redis:
  addr: "redis:6379"
  password: ""
  db: 0

storage:
  endpoint: "minio:9000"
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  bucket: "evaluating-platform"
  use_ssl: false

auth:
  jwt_secret: "${JWT_SECRET}"
  token_expiry_hours: 24

billing:
  mode: prepaid
  expert_share_rate: 0.3

maclaw:
  base_url: "http://maclaw-runtime:18080"
  runtime_kind: "maclawsrv"
  runtime_mode: "compose"
  capability_profile: "shadow"
  admin_secret: "${MACLAW_ADMIN_SECRET}"
  provisioning_enabled: true
  timeout_seconds: 360
  redteam_mcp_endpoint: "${MACLAW_REDTEAM_MCP_ENDPOINT}"
  redteam_mcp_secret: "${MACLAW_REDTEAM_MCP_SECRET}"
  redteam_target_concurrency: 5

crypto:
  master_key: "${CRYPTO_MASTER_KEY}"
  key_id: "v1"
