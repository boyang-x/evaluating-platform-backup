services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evaluating_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d   # 首次启动自动执行迁移
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ep_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MinIO (S3-compatible 文件存储) ─────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ep_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MinIO 初始化（创建 Bucket）────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: ep_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing local/evaluating-platform &&
      mc anonymous set download local/evaluating-platform/reports
      "
    restart: "no"

  # ── 评估平台后端 ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ep_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-chat}"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-dev}"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      GIN_MODE: debug
      DATABASE_DSN: "host=postgres user=postgres password=postgres dbname=evaluating_platform port=5432 sslmode=disable"
      REDIS_ADDR: "redis:6379"
      STORAGE_ENDPOINT: "minio:9000"
    ports:
      - "8080:8080"
    volumes:
      - ./configs:/app/configs:ro
      - ./migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── 前端开发服务器 ─────────────────────────────────────────
  ccbos_mcp:
    build:
      context: ../CC-BOS/mcp-server
      dockerfile: Dockerfile
    container_name: ep_ccbos_mcp
    restart: unless-stopped
    environment:
      CCBOS_MCP_PORT: 18191
      CCBOS_LISTEN_HOST: 0.0.0.0
      CCBOS_PUBLIC_BASE_URL: http://ccbos_mcp:18191
      CCBOS_API_BASE_URL: "${CCBOS_API_BASE_URL:-https://api.deepseek.com/v1}"
      CCBOS_API_KEY: "${CCBOS_API_KEY:-}"
      CCBOS_MODEL: "${CCBOS_MODEL:-deepseek-chat}"
      CCBOS_REQUEST_TIMEOUT_SECONDS: "${CCBOS_REQUEST_TIMEOUT_SECONDS:-60}"
      CCBOS_ARTIFACT_DIR: /app/artifacts
    ports:
      - "18191:18191"
    volumes:
      - ../CC-BOS/mcp-server/artifacts:/app/artifacts

  frontend:
    image: node:22-alpine
    container_name: ep_frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: "http://backend:8080"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: ep_network
